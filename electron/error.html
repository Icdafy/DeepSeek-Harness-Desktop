<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness could not start</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #eef2ff;
        background: #0b1020;
      }
      main { max-width: 620px; padding: 48px; text-align: center; }
      .mark { font-size: 56px; color: #ff8f8f; }
      h1 { margin: 16px 0 12px; font-size: 26px; }
      p { margin: 0; line-height: 1.65; color: #aab4d6; }
      code { color: #dbe3ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">!</div>
      <h1>DeepSeek Harness could not start</h1>
      <p>
        Check the error dialog for details. You can then use
        <code>File → Restart Harness</code> or open the log folder from the File menu.
      </p>
    </main>
  </body>
</html>
