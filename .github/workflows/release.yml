name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test source
        run: pnpm run test

      - name: Build Windows artifacts
        run: pnpm run dist

      - name: Generate checksums
        run: pnpm run checksums

      - name: Verify packaged application
        run: pnpm run verify:dist

      - name: Create draft release and upload all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path 'docs/releases' "$tag.md"
          $assets = @(
            Get-ChildItem -LiteralPath 'dist' -File |
              Where-Object { $_.Name -match '^DeepSeek-Harness-Desktop-(Setup|Portable)-.*\.exe$' -or $_.Name -eq 'SHA256SUMS.txt' } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -ne 3) {
            throw "Expected two executables and SHA256SUMS.txt, found $($assets.Count) release assets"
          }
          if (Test-Path -LiteralPath $notesPath) {
            gh release create $tag @assets --verify-tag --draft --title "DeepSeek Harness Desktop $tag" --notes-file $notesPath
          }
          else {
            gh release create $tag @assets --verify-tag --draft --title "DeepSeek Harness Desktop $tag" --generate-notes
          }
          gh release edit $tag --draft=false --latest
