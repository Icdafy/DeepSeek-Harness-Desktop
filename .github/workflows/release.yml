name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test source
        run: pnpm run test

      - name: Build Windows artifacts
        run: pnpm run dist

      - name: Generate checksums
        run: pnpm run checksums

      - name: Verify packaged application
        run: pnpm run verify:dist

      - name: Create draft release and upload all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesPath = Join-Path 'docs/releases' "$tag.md"
          $assets = @(
            Get-ChildItem -LiteralPath 'dist' -File |
              Where-Object {
                $_.Name -match '^DeepSeek-Harness-(Setup|Portable)-.*\.exe$' -or
                $_.Name -match '^DeepSeek-Harness-Setup-.*\.exe\.blockmap$' -or
                $_.Name -in @('latest.yml', 'SHA256SUMS.txt')
              } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -ne 5) {
            throw "Expected installer, portable executable, updater metadata, blockmap, and checksums; found $($assets.Count) release assets"
          }
          if (Test-Path -LiteralPath $notesPath) {
            gh release create $tag @assets --verify-tag --draft --title "DeepSeek Harness $tag" --notes-file $notesPath
          }
          else {
            gh release create $tag @assets --verify-tag --draft --title "DeepSeek Harness $tag" --generate-notes
          }
          gh release edit $tag --draft=false --latest
