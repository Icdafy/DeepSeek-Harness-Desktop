packages:
  - .
  - desktop-chat
  - desktop-updater
  - runtime

managePackageManagerVersions: false
confirmModulesPurge: false
verifyDepsBeforeRun: false
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted
injectWorkspacePackages: true

patchedDependencies:
  '@deepseek-ai/dsh-client-ui-sidebar@0.1.0-rc.6': patches/@deepseek-ai__dsh-client-ui-sidebar@0.1.0-rc.6.patch

# Match the lifecycle-script allowlist reviewed by the upstream repository.
allowBuilds:
  node-pty: true
  koffi: true
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  lefthook: true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  electron-winstaller: false
  electron: true

minimumReleaseAgeExclude:
  - dsh-client-ui-aqua@1.3.1
